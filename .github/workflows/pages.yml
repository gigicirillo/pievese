name: Publish complete centenary website
on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check media already stored in the repository
        id: media
        run: |
          if python3 scripts/verify-assets.py && test -s assets/stadium.jpg && test -s assets/strike-fluid.mp4 && test -s assets/strike-fluid.webm; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install media tools only when media must be rebuilt
        if: steps.media.outputs.ready != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Recover completed media and extract original sequences
        if: steps.media.outputs.ready != 'true'
        run: python3 scripts/resume-assets.py --source "$RUNNER_TEMP/pievese-media"
      - name: Prepare full-screen stadium and continuous video playback
        if: steps.media.outputs.ready != 'true'
        run: python3 scripts/prepare-cinema.py
      - name: Block publication unless every original asset is complete
        run: python3 scripts/verify-assets.py
      - name: Preserve verified media in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/manifest.json assets/stadium.jpg assets/*.mp4 assets/*.webm frames/
          if ! git diff --cached --quiet; then
            git commit -m "Save verified cinema media [skip ci]"
            git push origin HEAD:main
          fi
      - name: Stage only public website files
        run: |
          mkdir -p public
          cp index.html styles.css app.js public/
          mkdir -p public/assets
          cp assets/manifest.json assets/anchor.jpg assets/stadium.jpg assets/logo-pievese.png assets/*.mp4 assets/*.webm public/assets/
          cp assets/tuttocampo.json public/assets/
          cp -r assets/fonts public/assets/
          cp -r frames public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
